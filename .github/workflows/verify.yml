name: verify

on:
  push:
  pull_request:

jobs:
  release-verification:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install OpenCode 2
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash -s -- --version 2.2.5
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run verify:release

  windows-verification:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install ripgrep
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "ripgrep.zip"
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/15.2.0/ripgrep-15.2.0-x86_64-pc-windows-msvc.zip" -OutFile $archive
          Expand-Archive -Path $archive -DestinationPath (Join-Path $env:RUNNER_TEMP "ripgrep")
          Join-Path $env:RUNNER_TEMP "ripgrep\ripgrep-15.2.0-x86_64-pc-windows-msvc" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Install OpenCode 2
        run: npm install --global @opencode/cli@2.2.5
      - run: npm ci
      - run: npm run verify:release
